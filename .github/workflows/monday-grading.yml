name: Monday Grading Pipeline

on:
  schedule:
    - cron: '0 14 * * 1'   # Monday 14:00 UTC = 9 AM EST / 10 AM EDT
    - cron: '0 15 * * 1'   # Monday 15:00 UTC = 10 AM EST / 11 AM EDT retry

  workflow_dispatch:         # Manual trigger

jobs:
  grade:
    runs-on: ubuntu-latest

    # Without contents: write the checkout token is read-only and the final
    # push_dashboard_data push fails as github-actions[bot] (silently lost the
    # Rocket + Wyndham diagnostics, 2026-08). nightly-round-sim.yml has the
    # same block for the same reason.
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pandas numpy scipy requests python-dotenv gspread google-auth pyarrow xlsxwriter boto3 zstandard

    # CI runners have no git identity; without this the push_dashboard_data
    # commit fails ("Author identity unknown"), the subsequent push returns 0
    # trivially, and the run stays green while the week's diagnostics are lost
    # (recurred 2026-08-17: St. Jude). push_dashboard_data now also checks the
    # commit's exit status — this is the belt, that's the suspenders.
    - name: Configure git identity
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Run grading pipeline
      env:
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        # R2 access lets sg_diagnostic read the latest dg_historical snapshot
        # (adjusted SG actuals + archetypes) instead of degrading gracefully
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        # In-script alerts (push_dashboard_data._fail) read these directly;
        # without them send_telegram() returns False silently.
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python monday_grading.py
    - name: Telegram on failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        [ -n "$TELEGRAM_BOT_TOKEN" ] && curl -s --max-time 15 \
          "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="FAILED: monday-grading workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          >/dev/null || true
