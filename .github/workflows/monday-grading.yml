name: Monday Grading Pipeline

on:
  schedule:
    - cron: '0 14 * * 1'   # Monday 14:00 UTC = 9 AM EST / 10 AM EDT
    - cron: '0 15 * * 1'   # Monday 15:00 UTC = 10 AM EST / 11 AM EDT retry

  workflow_dispatch:         # Manual trigger

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pandas numpy scipy requests python-dotenv gspread google-auth pyarrow xlsxwriter

    - name: Run grading pipeline
      env:
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      run: python monday_grading.py
    - name: Telegram on failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        [ -n "$TELEGRAM_BOT_TOKEN" ] && curl -s --max-time 15 \
          "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="FAILED: monday-grading workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          >/dev/null || true
