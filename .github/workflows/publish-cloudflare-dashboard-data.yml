name: Publish Cloudflare Dashboard Data

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install publisher dependencies
      run: pip install pandas numpy scipy requests python-dotenv gspread google-auth pyarrow boto3 zstandard

    - name: Validate publisher
      run: python -m unittest discover -s cloudflare_dashboard/tests -p 'test_publish_*.py'

    - name: Export and publish dashboard JSON
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      run: python cloudflare_dashboard/scripts/publish_dashboard_data.py
