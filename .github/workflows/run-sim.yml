name: Run Round Simulation

# When to run this workflow
on:
  # Manual trigger with inputs
  workflow_dispatch:
    inputs:
      sim_round:
        description: 'Round to simulate (1-4)'
        required: true
        type: number
        default: 2
      expected_avg:
        description: 'Expected field scoring average (optional, reads from sheet if blank)'
        required: false
        type: number
  
  # Scheduled runs (optional - uncomment to enable)
  # schedule:
  #   - cron: '0 12 * * 4'  # Thursdays at noon UTC (after R1 typically)
  #   - cron: '0 12 * * 5'  # Fridays at noon UTC (after R2 typically)

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pandas numpy scipy requests python-dotenv gspread google-auth xlsxwriter
    
    - name: Fetch scraped odds from golf_scraping repo
      env:
        GH_TOKEN: ${{ secrets.GOLF_SCRAPING_PAT }}
      run: |
        mkdir -p permanent_data/scraped_odds
        for MARKET in tournament_matchups round_matchups; do
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "https://raw.githubusercontent.com/mslade50/golf_scraping/master/data/${MARKET}_latest.json" \
            -o "permanent_data/scraped_odds/${MARKET}_latest.json" || true
        done
        ls -la permanent_data/scraped_odds/ || true

    - name: Run simulation
      env:
        # GH_TOKEN: round_sim's publish hook dispatches a board build after a
        # successful push — absent token = silent no-op from CI.
        GH_TOKEN: ${{ secrets.GOLF_SCRAPING_PAT }}
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      run: |
        if [ -n "${{ github.event.inputs.expected_avg }}" ]; then
          # CLI mode with manual inputs
          python round_sim.py --cli --sim-round ${{ github.event.inputs.sim_round }} --expected-avg ${{ github.event.inputs.expected_avg }}
        elif [ -n "${{ github.event.inputs.sim_round }}" ]; then
          # CLI mode with just round number
          python round_sim.py --cli --sim-round ${{ github.event.inputs.sim_round }}
        else
          # Sheet mode (default)
          python round_sim.py
        fi
    
    - name: Upload simulation results
      uses: actions/upload-artifact@v7
      if: always()  # Upload even if simulation partially fails
      with:
        name: simulation-results
        path: |
          **/round_*_sim_*.xlsx
          **/fair_card_r*.csv
        retention-days: 30
    
    - name: Telegram on failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        [ -n "$TELEGRAM_BOT_TOKEN" ] && curl -s --max-time 15 \
          "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="FAILED: run-sim workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          >/dev/null || true
