name: Kalshi Preflight

# Confirms our configured tournament resolves to exactly one Kalshi event (by live
# DataGolf-field overlap) and that every priceable golf series open for it is handled.
#
# Kalshi opens golf markets PROGRESSIVELY through the week — winner/top-N early,
# R2/R3 leaders mid-week, 3-balls Thu/Fri once pairings post — so a single Monday run
# would pass resolution but miss everything that opens later. Hence it runs DAILY.
#
# Silent on success. On a real problem it exits non-zero — which turns the build
# red + notifies — and Telegrams the detail. That includes winner markets we
# cannot read (fewer than half name a player, even if 10+ readable futures
# names match the field), a winner-market fetch that errors (non-200, timeout,
# bad JSON, unfinished pagination), low overlap, or a NEW priceable series with
# open markets we don't handle.
# "Not listed yet" is a ::warning and a green run only when the winner GET
# succeeded, sim_inputs matches this week's DataGolf event (or an off week
# whose Kalshi book has not settled), and that successful book truly does not
# cover the field. A simple lag — field and schedule agree on one live event
# that sim_inputs.event_ids does not contain — is NOT READY YET: a ::warning,
# exit 0, and no Telegram. That green run does not place orders.
# kalshi_maker.py --live quotes only when DataGolf positively confirms that
# sim_inputs.event_ids contains the live event. The field-updates id wins on
# Monday if the schedule still names the completed event. No API key, a failed
# lookup, an empty config, or a schedule that does not narrow to one event
# halts live quoting (exit non-zero). A DataGolf outage halts live quoting.
# A quote pull that leaves an smk_ order resting also exits non-zero.
# STALE CONFIG still fails when the configured event has settled and no live
# or scheduled event can be confirmed, or when the field and the schedule
# disagree. The names used for overlap are DataGolf field-updates, the current
# event, not the sim_inputs tourney file, unless that live field is missing.
# KALSHI_PREFLIGHT_STRICT=1 restores the loud failure for a confirmed-current
# event that is not listed yet, and for a simple lag. It does not hide
# STALE CONFIG, an unreadable book, or a failed fetch, and it does not lift
# the maker's lag halt.

on:
  schedule:
    - cron: '0 13 * * *'      # daily 13:00 UTC (~9am ET) — catches markets as they open
  workflow_dispatch:           # manual run

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install httpx pandas numpy requests python-dotenv

      - name: Run Kalshi preflight
        env:
          # Preflight only needs tourney/name_replacements from sim_inputs, not
          # fitted coefficients — run from the committed coeffs_cache.json instead
          # of fetching the sheet (gspread isn't installed here).
          COEFFS_FROM_CACHE: "1"
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kalshi_preflight.py
