name: Reprice Matchups

on:
  repository_dispatch:
    types: [sentinel-scrape-complete]
  workflow_dispatch:

concurrency:
  group: reprice
  cancel-in-progress: false

jobs:
  reprice:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install pandas numpy scipy requests python-dotenv gspread google-auth pyarrow pytz

    - name: Detect round from sheet config
      id: detect
      env:
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      run: |
        python << 'PYEOF'
        import os
        from sheet_config import load_config
        cfg = load_config()
        tourney = cfg['tourney']
        sim_round = cfg['round_num'] + 1 if cfg['round_num'] < 4 else 4
        print(f'tourney={tourney}')
        print(f'sim_round={sim_round}')
        output_file = os.environ.get('GITHUB_OUTPUT', '')
        if output_file:
            with open(output_file, 'a') as f:
                f.write(f'tourney={tourney}\n')
                f.write(f'sim_round={sim_round}\n')
        PYEOF

    - name: Restore sim cache
      id: cache
      if: steps.detect.outputs.tourney != ''
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.detect.outputs.tourney }}/sim_cache_r*.parquet
          ${{ steps.detect.outputs.tourney }}/sim_cache_r*_meta.json
        key: sim-cache-${{ steps.detect.outputs.tourney }}-r${{ steps.detect.outputs.sim_round }}

    - name: Verify cache exists
      if: steps.cache.outputs.cache-hit != 'true'
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        echo "No sim cache found for ${{ steps.detect.outputs.tourney }} R${{ steps.detect.outputs.sim_round }}"
        echo "Nightly sim must run first to populate the cache."
        # Send Telegram notification
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="Reprice: no sim cache for R${{ steps.detect.outputs.sim_round }} ${{ steps.detect.outputs.tourney }}. Run nightly sim first." \
            -d parse_mode="HTML" || true
        fi
        exit 0

    - name: Fetch fresh odds from golf_scraping
      if: steps.cache.outputs.cache-hit == 'true'
      env:
        GH_TOKEN: ${{ secrets.GOLF_SCRAPING_PAT }}
      run: |
        mkdir -p permanent_data/scraped_odds
        for MARKET in round_matchups round_scores kalshi_outrights; do
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "https://raw.githubusercontent.com/mslade50/golf_scraping/master/data/${MARKET}_latest.json" \
            -o "permanent_data/scraped_odds/${MARKET}_latest.json" || true
        done
        echo "Fetched odds files:"
        ls -la permanent_data/scraped_odds/ || true

    - name: Run reprice
      if: steps.cache.outputs.cache-hit == 'true'
      env:
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python round_sim.py --reprice
