name: Reprice Matchups

on:
  repository_dispatch:
    types: [sentinel-scrape-complete]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Smoke test: price + print only (no dedup/store/Telegram/R2 push)"
        type: boolean
        default: false

concurrency:
  group: reprice
  cancel-in-progress: false

jobs:
  reprice:
    runs-on: ubuntu-latest

    steps:
    - name: Skip if outside tournament window (Thu night – Sun morning)
      id: window
      run: |
        DOW=$(date -u +%u)  # 1=Mon ... 7=Sun
        if [ "$DOW" -ge 1 ] && [ "$DOW" -le 4 ]; then
          echo "Day $DOW is outside Thu-Sun window, skipping."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout repository
      if: steps.window.outputs.skip != 'true'
      uses: actions/checkout@v5

    - name: Set up Python
      if: steps.window.outputs.skip != 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    # Cache-free repricer: loads the committed round_h2h_r{N}.parquet fair table
    # (published by the nightly sim / live full runs), prices fresh odds, dedups,
    # stores, and Telegram-alerts. No Rust kernel, no xlsxwriter, no sim cache.
    - name: Install dependencies
      if: steps.window.outputs.skip != 'true'
      run: |
        pip install pandas numpy requests python-dotenv gspread google-auth pyarrow pytz boto3

    - name: Fetch fresh round-matchup odds from golf_scraping
      if: steps.window.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ secrets.GOLF_SCRAPING_PAT }}
      run: |
        mkdir -p permanent_data/scraped_odds
        curl -sL -H "Authorization: token $GH_TOKEN" \
          "https://raw.githubusercontent.com/mslade50/golf_scraping/master/data/round_matchups_latest.json" \
          -o "permanent_data/scraped_odds/round_matchups_latest.json" || true
        ls -la permanent_data/scraped_odds/ || true

    - name: Run reprice
      if: steps.window.outputs.skip != 'true'
      env:
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_ROUND_BETS_CHAT_ID: ${{ secrets.TELEGRAM_ROUND_BETS_CHAT_ID }}
        GH_TOKEN: ${{ secrets.GOLF_SCRAPING_PAT }}
      run: python reprice.py ${{ inputs.dry_run && '--dry-run' || '' }}

    - name: Check odds screen release inputs
      id: odds_screen_release
      if: steps.window.outputs.skip != 'true' && inputs.dry_run != true
      shell: bash
      run: |
        missing=()
        for file in sim_release_manifest.json sim_fairs.json; do
          if [ ! -s "$file" ]; then
            missing+=("$file")
          fi
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Odds screen publish skipped::Reprice succeeded, but odds screen build and publish were skipped because the current checkout lacks required release input(s): ${missing[*]}"
        else
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and validate odds screen payloads
      if: steps.window.outputs.skip != 'true' && inputs.dry_run != true && steps.odds_screen_release.outputs.ready == 'true'
      env:
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        GH_TOKEN: ${{ secrets.GOLF_SCRAPING_PAT }}
      run: |
        python push_odds_screen.py --output-dir "$RUNNER_TEMP/odds-screen"
        find "$RUNNER_TEMP/odds-screen" -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
          python -m json.tool "$file" >/dev/null
          test -s "$file"
        done

    # Wrangler uses the same scoped Cloudflare API token as the working CLV
    # transport. Every market lives under an immutable generation key. Root
    # meta.json is the only consumer-visible pointer and is uploaded last; a
    # partial retry therefore leaves readers on the prior complete generation.
    - name: Publish odds screen payloads to R2
      if: steps.window.outputs.skip != 'true' && inputs.dry_run != true && steps.odds_screen_release.outputs.ready == 'true'
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      run: |
        set -euo pipefail
        upload() {
          key="$1"
          source="$2"
          for attempt in 1 2 3; do
            if npx --yes wrangler@4 r2 object put \
              "golf-odds-data/odds_data/$key" \
              --file "$source" \
              --content-type application/json \
              --remote; then
              return 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Failed to publish $key after 3 attempts" >&2
          return 1
        }
        python -c 'import os; from pathlib import Path; from push_odds_screen import _atomic_upload_plan; root=Path(os.environ["RUNNER_TEMP"])/"odds-screen"; print("\n".join(f"{key}\t{path}" for key,path in _atomic_upload_plan(root)))' \
          > "$RUNNER_TEMP/odds-screen-upload-plan.tsv"
        while IFS=$'\t' read -r key source; do
          upload "$key" "$source"
        done < "$RUNNER_TEMP/odds-screen-upload-plan.tsv"
    - name: Telegram on failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        [ -n "$TELEGRAM_BOT_TOKEN" ] && curl -s --max-time 15 \
          "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="FAILED: reprice workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          >/dev/null || true
