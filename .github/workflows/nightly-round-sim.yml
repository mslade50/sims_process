name: Nightly Round Sim Backup

on:
  schedule:
    # Fixed at 02:45 UTC: 9:45 PM EST / 10:45 PM EDT (previous day)
    # Runs Thu night (after R1), Fri night (after R2), Sat night (after R3)
    - cron: '45 2 * * 5'   # Friday UTC = Thursday evening ET
    - cron: '45 2 * * 6'   # Saturday UTC = Friday evening ET
    - cron: '45 2 * * 0'   # Sunday UTC = Saturday evening ET

  workflow_dispatch:         # Manual trigger
    inputs:
      publish_dashboard:
        description: "Publish refreshed dashboard data after the live package"
        required: false
        type: boolean
        default: false

concurrency:
  group: round-sim
  cancel-in-progress: false

jobs:
  round-sim:
    runs-on: [self-hosted, Windows, X64, golf-sim]
    permissions:
      contents: write   # publish_sim_fairs atomically pushes the complete live package
    env:
      RUNNER_PYTHON: 'C:\actions-runner\python310-portable\tools\python.exe'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        clean: true

    - name: Install dependencies
      shell: powershell
      run: |
        & $env:RUNNER_PYTHON --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & $env:RUNNER_PYTHON -m pip install -r requirements.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & $env:RUNNER_PYTHON -m pip install pytz
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install and verify production sims_kernel
      shell: powershell
      run: |
        & $env:RUNNER_PYTHON -m pip install --force-reinstall --no-deps `
          "https://github.com/mslade50/sims_process/releases/download/wheels-latest/sims_kernel-0.2.0-cp310-abi3-win_amd64.whl"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & $env:RUNNER_PYTHON -c "import sims_kernel as k; print('sims_kernel', k.version(), k.selftest())"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Fetch scraped odds from golf_scraping repo
      shell: powershell
      env:
        GH_TOKEN: ${{ secrets.GOLF_SCRAPING_PAT }}
      run: |
        $oddsDir = Join-Path $PWD "permanent_data\scraped_odds"
        New-Item -ItemType Directory -Path $oddsDir -Force | Out-Null
        $headers = @{ Authorization = "token $env:GH_TOKEN" }
        foreach ($market in @("tournament_matchups", "round_matchups")) {
          try {
            Invoke-WebRequest `
              -Uri "https://raw.githubusercontent.com/mslade50/golf_scraping/master/data/$($market)_latest.json" `
              -Headers $headers `
              -OutFile (Join-Path $oddsDir "$($market)_latest.json") `
              -TimeoutSec 30
          } catch {
            Write-Warning "Could not fetch $market odds: $($_.Exception.Message)"
          }
        }
        Get-ChildItem $oddsDir

    - name: Run and validate complete nightly live simulation
      id: live_sim
      shell: powershell
      env:
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        REQUIRE_SIMS_KERNEL: '1'
      run: |
        & $env:RUNNER_PYTHON nightly_round_sim.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Publish one atomic git package: live outrights + tournament H2H, exact
    # round-score PMFs/H2H, and paired tournament/made-cut tapes. The simulation
    # ran under --dry-run, so this step is the only external success-side effect.
    # The pinned board refresh is model-only: it preserves frozen book quotes and
    # does not launch reprice/store/Telegram automation.
    - name: Publish complete live market package
      if: steps.live_sim.outputs.should_publish == 'true'
      shell: powershell
      env:
        # GH_TOKEN lets _dispatch_board_build fire the sim-fairs-published
        # repository_dispatch at golf_scraping from CI (without it the dispatch
        # silently no-ops and only laptop publishes trigger a board build).
        GH_TOKEN: ${{ secrets.GOLF_SCRAPING_PAT }}
        # Strict R2-R4 publishing needs DataGolf to seal the current tee-group
        # contract; a missing/incomplete response now fails instead of retaining
        # or implying an older 3-ball artifact.
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        # publish_sim_fairs imports sim_inputs -> coeff_loader, which needs sheet
        # credentials; without this env it falls back to credentials.json (absent
        # in CI) and the whole publish step dies (broke every run 7/17-7/24).
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        # A backup is successful only after the commit reaches main and the pinned
        # board build accepts the dispatch. No silent local-only success.
        REQUIRE_SIM_FAIRS_PUBLISH: '1'
        # Rebuild the board from these fairs without cascading into bet storage or
        # routine Telegram alerts. The board's freeze logic keeps book odds fixed.
        BOARD_SUPPRESS_SIM_CASCADE: '1'
        # CI runners have no git user.name/email, so publish's `git commit-tree`
        # dies ('Committer identity unknown') and the push is silently skipped —
        # every CI publish before 7/24 no-opped this way. Identity via env keeps
        # the plumbing path working without touching runner git config.
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      run: |
        & $env:RUNNER_PYTHON publish_sim_fairs.py `
          --require-complete-live `
          --expected-round "${{ steps.live_sim.outputs.sim_round }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Optional manual repair only. nightly_round_sim.py runs both model stages
    # in dry-run/no-sheet-write mode, so enabling this publishes model/dashboard
    # artifacts without sending bets, reports, or ordinary Telegram alerts.
    - name: Publish dashboard data to GitHub and Cloudflare
      if: success() && inputs.publish_dashboard == true && steps.live_sim.outputs.should_publish == 'true'
      shell: powershell
      env:
        # The checkout token is scoped by contents: write above and remains the
        # credential used by push_dashboard_data.py's git push.
        GH_TOKEN: ${{ github.token }}
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        DASHBOARD_R2_ACCESS_KEY_ID: ${{ secrets.DASHBOARD_R2_ACCESS_KEY_ID }}
        DASHBOARD_R2_SECRET_ACCESS_KEY: ${{ secrets.DASHBOARD_R2_SECRET_ACCESS_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      run: |
        & $env:RUNNER_PYTHON push_dashboard_data.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Telegram on failure
      if: failure()
      shell: powershell
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if ($env:TELEGRAM_BOT_TOKEN -and $env:TELEGRAM_CHAT_ID) {
          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = "FAILED: nightly-round-sim workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          try {
            Invoke-RestMethod `
              -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" `
              -Method Post `
              -Body $body `
              -TimeoutSec 15 | Out-Null
          } catch {
            Write-Warning "Telegram failure notification could not be sent: $($_.Exception.Message)"
          }
        }
