name: Nightly Round Sim Backup

on:
  schedule:
    # 9:45 PM EST = 02:45 UTC (next day)
    # Runs Thu night (after R1), Fri night (after R2), Sat night (after R3)
    - cron: '45 2 * * 5'   # Friday 02:45 UTC = Thursday 9:45 PM EST
    - cron: '45 2 * * 6'   # Saturday 02:45 UTC = Friday 9:45 PM EST
    - cron: '45 2 * * 0'   # Sunday 02:45 UTC = Saturday 9:45 PM EST

  workflow_dispatch:         # Manual trigger

jobs:
  round-sim:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pandas numpy scipy requests python-dotenv gspread google-auth pyarrow xlsxwriter pytz patsy statsmodels scikit-learn matplotlib

    - name: Fetch scraped odds from golf_scraping repo
      env:
        GH_TOKEN: ${{ secrets.GOLF_SCRAPING_PAT }}
      run: |
        mkdir -p permanent_data/scraped_odds
        for MARKET in tournament_matchups round_matchups; do
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "https://raw.githubusercontent.com/mslade50/golf_scraping/master/data/${MARKET}_latest.json" \
            -o "permanent_data/scraped_odds/${MARKET}_latest.json" || true
        done
        ls -la permanent_data/scraped_odds/ || true

    - name: Run sim-only (cache arrays for reprice)
      env:
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      run: python nightly_round_sim.py

    - name: Detect sim cache for Actions cache
      id: cache-key
      run: |
        # Find the most recently written sim cache parquet
        CACHE_FILE=$(find . -name "sim_cache_r*.parquet" -newer /tmp -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2 || true)
        if [ -n "$CACHE_FILE" ]; then
          # Extract tourney dir and round from path like ./tourney_name/sim_cache_r2.parquet
          TOURNEY_DIR=$(dirname "$CACHE_FILE" | sed 's|^\./||')
          ROUND=$(echo "$CACHE_FILE" | grep -oP 'r\d+')
          echo "cache_key=sim-cache-${TOURNEY_DIR##*/}-${ROUND}" >> $GITHUB_OUTPUT
          echo "cache_path=${TOURNEY_DIR}" >> $GITHUB_OUTPUT
          echo "Found cache: $CACHE_FILE (key=sim-cache-${TOURNEY_DIR##*/}-${ROUND})"
        else
          echo "cache_key=" >> $GITHUB_OUTPUT
          echo "cache_path=" >> $GITHUB_OUTPUT
          echo "No sim cache found"
        fi

    - name: Save sim cache to Actions cache
      if: steps.cache-key.outputs.cache_key != ''
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ steps.cache-key.outputs.cache_path }}/sim_cache_r*.parquet
          ${{ steps.cache-key.outputs.cache_path }}/sim_cache_r*_meta.json
        key: ${{ steps.cache-key.outputs.cache_key }}
