name: Nightly Round Sim Backup

on:
  schedule:
    # 9:45 PM EST = 02:45 UTC (next day)
    # Runs Thu night (after R1), Fri night (after R2), Sat night (after R3)
    - cron: '45 2 * * 5'   # Friday 02:45 UTC = Thursday 9:45 PM EST
    - cron: '45 2 * * 6'   # Saturday 02:45 UTC = Friday 9:45 PM EST
    - cron: '45 2 * * 0'   # Sunday 02:45 UTC = Saturday 9:45 PM EST

  workflow_dispatch:         # Manual trigger

jobs:
  round-sim:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish_sim_fairs pushes round_h2h_r{N} to main

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pandas numpy scipy requests python-dotenv gspread google-auth pyarrow xlsxwriter pytz

    - name: Install sims_kernel Rust wheel (falls back to Python if unavailable)
      run: |
        pip install --force-reinstall --no-deps \
          "https://github.com/mslade50/sims_process/releases/download/wheels-latest/sims_kernel-0.1.0-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" \
          && python -c "import sims_kernel as k; print('sims_kernel', k.version(), k.selftest())" \
          || echo "sims_kernel wheel unavailable — round_sim will use the Python fallback"

    - name: Fetch scraped odds from golf_scraping repo
      env:
        GH_TOKEN: ${{ secrets.GOLF_SCRAPING_PAT }}
      run: |
        mkdir -p permanent_data/scraped_odds
        for MARKET in tournament_matchups round_matchups; do
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "https://raw.githubusercontent.com/mslade50/golf_scraping/master/data/${MARKET}_latest.json" \
            -o "permanent_data/scraped_odds/${MARKET}_latest.json" || true
        done
        ls -la permanent_data/scraped_odds/ || true

    - name: Run nightly round sim backup
      env:
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      run: python nightly_round_sim.py

    # ── Publish the compact round-H2H fair table to the repo so reprice.py can
    # price matchups WITHOUT restoring the 60 MB sim cache. nightly_round_sim.py
    # runs round_sim.py --sim-only, which returns before round_sim's own publish
    # hook, so we publish the H2H table explicitly here. Reads the just-created
    # local sim_cache_r{N}.parquet; pushes round_h2h_r{N}.parquet (+ _meta.json)
    # to main via git plumbing (needs contents: write above).
    - name: Publish round H2H fair table
      env:
        # GH_TOKEN lets _dispatch_board_build fire the sim-fairs-published
        # repository_dispatch at golf_scraping from CI (without it the dispatch
        # silently no-ops and only laptop publishes trigger a board build).
        GH_TOKEN: ${{ secrets.GOLF_SCRAPING_PAT }}
        # _tee_groups needs DataGolf for real tee-time threesomes; without it the
        # 3-ball publish silently returns no groups.
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
      run: python publish_sim_fairs.py --round-h2h-only
    - name: Telegram on failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        [ -n "$TELEGRAM_BOT_TOKEN" ] && curl -s --max-time 15 \
          "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="FAILED: nightly-round-sim workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          >/dev/null || true
