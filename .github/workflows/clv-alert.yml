name: Morning CLV Alert

on:
  schedule:
    # Fixed at 11:30 UTC: 6:30 AM EST / 7:30 AM EDT
    # Fri morning (R1 bets), Sat morning (R2 bets), Sun morning (R3 bets)
    - cron: '30 11 * * 5'   # Friday
    - cron: '30 11 * * 6'   # Saturday
    - cron: '30 11 * * 0'   # Sunday

  workflow_dispatch:

jobs:
  clv:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install pandas numpy scipy requests python-dotenv gspread google-auth pyarrow pytz boto3

    - name: Fetch frozen board closing snapshot
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      run: |
        mkdir -p permanent_data
        npx --yes wrangler@4 r2 object get \
          golf-odds-board/board/closing.json \
          --file permanent_data/board_closing.json \
          --remote
        python -m json.tool permanent_data/board_closing.json >/dev/null

    - name: Run CLV alert
      env:
        DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        # Fail closed: never substitute a live quote for the frozen close in CI.
        CLV_BOARD_CLOSING_PATH: ${{ github.workspace }}/permanent_data/board_closing.json
        CLV_REQUIRE_FROZEN_CLOSING: '1'
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python clv_alert.py
    - name: Telegram on failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        [ -n "$TELEGRAM_BOT_TOKEN" ] && curl -s --max-time 15 \
          "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          -d chat_id="$TELEGRAM_CHAT_ID" \
          -d text="FAILED: clv-alert workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          >/dev/null || true
