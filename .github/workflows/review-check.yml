name: review-check

# Proof and Rollback must be filled in. The tests job runs the secret-free
# suite (python secret_free_tests.py): offline modules only, one process per
# file. Nothing secret is read or printed. The PR body is passed only through
# env vars. Dependabot and Renovate skip the template rule inside
# scripts/check_pr_body.py; other bots and agents do not. Fork pull requests
# stay safe: pull_request only, a read-only token, and ubuntu-latest.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  body:
    name: PR body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check Proof and Rollback
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/check_pr_body.py

  tests:
    name: Secret-free tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COEFFS_FROM_CACHE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8.1,<10"

      - name: Run secret-free tests
        run: python secret_free_tests.py
