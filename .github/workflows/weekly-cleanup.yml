name: Weekly Data Cleanup

# Runs Monday afternoon AFTER the grading pipeline (9/10 AM EST)
on:
  schedule:
    - cron: '0 17 * * 1'  # Every Monday at 17:00 UTC = 12:00 PM EST
  
  # Also allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Run cleanup script
      run: |
        # Create backup of any files we're about to delete (just in case)
        mkdir -p cleanup_backup
        
        echo "🗑️  Starting weekly data cleanup..."
        echo "================================================"
        
        # Count files before cleanup
        csv_count=$(find . -maxdepth 1 -name "*.csv" ! -path "./permanent_data/*" | wc -l)
        xlsx_count=$(find . -maxdepth 1 -name "*.xlsx" | wc -l)
        txt_count=$(find . -maxdepth 1 -name "*.txt" | wc -l)
        
        echo "📊 Files to clean:"
        echo "  - CSV files in root: $csv_count"
        echo "  - Excel files in root: $xlsx_count"  
        echo "  - Text files in root: $txt_count"
        echo ""
        
        # List files that will be deleted (for logging)
        echo "📋 CSV files to be removed:"
        find . -maxdepth 1 -name "*.csv" ! -path "./permanent_data/*" -type f
        echo ""
        
        echo "📋 Excel files to be removed:"
        find . -maxdepth 1 -name "*.xlsx" -type f
        echo ""
        
        echo "📋 Tournament folders to be removed:"
        find . -maxdepth 1 -type d \
          ! -name "." ! -name ".." \
          ! -name ".git" ! -name ".github" ! -name ".githooks" ! -name ".claude" \
          ! -name "__pycache__" \
          ! -name "permanent_data" ! -name "backups" \
          ! -name "dashboard" ! -name "dashboard_data" ! -name "maker_dashboard" \
          ! -name "archive" ! -name "rust"
        echo ""
        
        # Delete CSV files (except in permanent_data folder)
        echo "🗑️  Deleting CSV files..."
        find . -maxdepth 1 -name "*.csv" ! -path "./permanent_data/*" -type f -delete
        
        # Delete Excel files
        echo "🗑️  Deleting Excel files..."
        find . -maxdepth 1 -name "*.xlsx" -type f -delete
        
        # Delete text files (scraped sportsbook data) — protect requirements.txt
        echo "🗑️  Deleting text files..."
        find . -maxdepth 1 -name "*.txt" ! -name "requirements.txt" -type f -delete

        # Delete Parquet files in root (not permanent_data/)
        echo "🗑️  Deleting root Parquet files..."
        find . -maxdepth 1 -name "*.parquet" -type f -delete

        # Delete PDF files in root
        echo "🗑️  Deleting PDF files..."
        find . -maxdepth 1 -name "*.pdf" -type f -delete

        # Delete stale artifacts (Windows nul file, etc.)
        rm -f ./nul 2>/dev/null || true

        # Delete tournament folders (but preserve system folders).
        # IMPORTANT: This is a denylist — anything NOT in the exclude list
        # gets nuked. New top-level prod directories MUST be added here or
        # they'll be deleted on the next run. Safety check below catches
        # accidental deletions before commit.
        echo "🗑️  Deleting tournament folders..."
        find . -maxdepth 1 -type d \
          ! -name "." \
          ! -name ".." \
          ! -name ".git" \
          ! -name ".github" \
          ! -name ".githooks" \
          ! -name ".claude" \
          ! -name "__pycache__" \
          ! -name "permanent_data" \
          ! -name "backups" \
          ! -name "dashboard" \
          ! -name "dashboard_data" \
          ! -name "maker_dashboard" \
          ! -name "archive" \
          ! -name "rust" \
          -exec rm -rf {} + 2>/dev/null || true

        # Clear tournament-specific dashboard_data/ files (keep persistent data for Render)
        echo "🗑️  Clearing tournament-specific dashboard_data/ files..."
        find ./dashboard_data -type f \
          ! -name ".gitkeep" \
          ! -name "sg_diagnostic.parquet" \
          ! -name "luck_attribution.parquet" \
          -delete 2>/dev/null || true

        # Clear committed per-tournament prep that lives UNDER permanent_data/ (so it
        # is missed by the root-CSV sweep). Root prep (final_predictions_*, pre_course_fit_*,
        # this_week_dists_v2, sg_dist_player) is already removed above. This is a TARGETED
        # pattern — it must NOT touch the permanent reference data (correlation matrices,
        # bet_ledger.parquet, sg_diagnostic.parquet, wind_test.csv, course_coordinates.csv).
        echo "🗑️  Clearing stale per-tournament prep under permanent_data/..."
        rm -f permanent_data/avg_expected_cat_sg_*.csv 2>/dev/null || true

        echo ""
        echo "✅ Cleanup complete!"
        echo "================================================"
        
        # Show what remains
        echo ""
        echo "📁 Remaining files in repo:"
        ls -lah
    
    - name: Summary
      run: |
        echo "================================================"
        echo "🎯 CLEANUP SUMMARY"
        echo "================================================"
        echo "✅ Deleted all CSV files (except permanent_data/)"
        echo "✅ Deleted all Excel workbooks"
        echo "✅ Deleted all text files"
        echo "✅ Deleted all tournament folders"
        echo "✅ Cleared tournament files from dashboard_data/ (kept sg_diagnostic, luck_attribution)"
        echo ""
        echo "📁 Protected folders:"
        echo "  - permanent_data/ (correlation matrices, reference data)"
        echo "  - dashboard/ (dashboard app code)"
        echo "  - dashboard_data/ (staging dir, cleared)"
        echo "  - backups/ (code backups)"
        echo "  - .github/ (workflows)"
        echo "  - .git/ (version control)"
        echo ""
        echo "💡 Tip: Historical data should now be in Google Drive"
        echo "================================================"

    - name: Safety check — abort if critical files missing
      run: |
        # If the denylist excludes are wrong, the delete step can wipe prod
        # code. This guard checks for specific sentinel files BEFORE we
        # commit. If any are missing, the workflow fails loud rather than
        # silently pushing the destruction.
        critical=(
          "maker_dashboard/server.py"
          "maker_dashboard/static/app.js"
          "maker_dashboard/index.html"
          ".githooks/pre-commit"
          "dashboard/app.py"
          "kalshi_maker.py"
          "new_sim.py"
          "round_sim.py"
          "sim_inputs.py"
          "rust/Cargo.toml"
          "rust/src/lib.rs"
        )
        missing=()
        for f in "${critical[@]}"; do
          if [ ! -f "$f" ]; then
            missing+=("$f")
          fi
        done
        if [ ${#missing[@]} -ne 0 ]; then
          echo "❌ Cleanup deleted critical files — refusing to commit:"
          printf '   - %s\n' "${missing[@]}"
          echo ""
          echo "The denylist in the delete step is missing an entry. Fix it"
          echo "before re-enabling this workflow."
          exit 1
        fi
        echo "✅ All critical files still present after cleanup."

    - name: Commit and push cleanup
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --staged --quiet || git commit -m "Weekly cleanup: clear transient data"
        git push
