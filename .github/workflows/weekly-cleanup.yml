name: Weekly Data Cleanup

# Runs Monday afternoon AFTER the 14:00/15:00 UTC grading pipeline
on:
  schedule:
    - cron: '0 17 * * 1'  # Monday 17:00 UTC = noon EST / 1 PM EDT
  
  # Also allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Run cleanup script
      run: |
        echo "🗑️  Starting weekly data cleanup..."
        echo "================================================"
        
        # Current tournament slug from sim_inputs.py (regex parse — no import, no deps).
        # Files & folders whose name contains this slug are CURRENT-WEEK and MUST be
        # preserved; only data tied to PAST weeks is cleaned. Abort if unreadable
        # (fail safe rather than risk deleting current-week files).
        TOURNEY=$(sed -nE "s/^tourney[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/p" sim_inputs.py | head -1 | tr '[:upper:]' '[:lower:]')
        if [ -z "$TOURNEY" ]; then
          echo "❌ Could not read current tourney from sim_inputs.py — aborting (refuse to delete current-week files)."
          exit 1
        fi
        echo "📅 Current tournament (PRESERVED): $TOURNEY"
        echo "TOURNEY=$TOURNEY" >> "$GITHUB_ENV"
        echo ""

        # Exclusions applied to every data sweep: the current tourney slug plus the
        # tracked generic current-week artifacts that carry no slug (round H2H fair
        # tables, round samples, and the rebuilt-weekly distribution files). Anything
        # tied to the active week is kept. NOTE: if a new tracked generic per-week
        # file is added, list it here or the next cleanup will delete it.
        KEEP=(
          ! -name "*${TOURNEY}*"
          ! -name "round_h2h_r*.parquet"
          ! -name "round_3ball_r*.parquet"
          ! -name "round_samples.parquet"
          ! -name "tournament_samples.parquet"
          ! -name "tournament_made_cut.parquet"
          ! -name "sg_dist_player.csv"
          ! -name "this_week_dists_v2.csv"
        )

        # Count files before cleanup
        csv_count=$(find . -maxdepth 1 -name "*.csv" ! -path "./permanent_data/*" | wc -l)
        xlsx_count=$(find . -maxdepth 1 -name "*.xlsx" | wc -l)
        txt_count=$(find . -maxdepth 1 -name "*.txt" | wc -l)
        
        echo "📊 Files to clean:"
        echo "  - CSV files in root: $csv_count"
        echo "  - Excel files in root: $xlsx_count"  
        echo "  - Text files in root: $txt_count"
        echo ""
        
        # List files that will be deleted (for logging) — current-week files excluded
        echo "📋 Past-week CSV files to be removed (current week '$TOURNEY' kept):"
        find . -maxdepth 1 -name "*.csv" "${KEEP[@]}" ! -path "./permanent_data/*" -type f
        echo ""

        echo "📋 Past-week Excel files to be removed:"
        find . -maxdepth 1 -name "*.xlsx" "${KEEP[@]}" -type f
        echo ""

        # Delete CSV files (except permanent_data/ and current-week files)
        echo "🗑️  Deleting past-week CSV files..."
        find . -maxdepth 1 -name "*.csv" "${KEEP[@]}" ! -path "./permanent_data/*" -type f -delete

        # Delete Excel files (except current-week)
        echo "🗑️  Deleting past-week Excel files..."
        find . -maxdepth 1 -name "*.xlsx" "${KEEP[@]}" -type f -delete
        
        # Delete text files (scraped sportsbook data) — protect requirements.txt
        echo "🗑️  Deleting text files..."
        find . -maxdepth 1 -name "*.txt" ! -name "requirements.txt" -type f -delete

        # Delete Parquet files in root (not permanent_data/, not current-week)
        echo "🗑️  Deleting past-week root Parquet files..."
        find . -maxdepth 1 -name "*.parquet" "${KEEP[@]}" -type f -delete

        # Delete PDF files in root (except current-week)
        echo "🗑️  Deleting past-week PDF files..."
        find . -maxdepth 1 -name "*.pdf" "${KEEP[@]}" -type f -delete

        # Delete stale artifacts (Windows nul file, etc.)
        rm -f ./nul 2>/dev/null || true

        # Never recursively delete a top-level directory. Production directories
        # have expanded over time (deploy/, odds_screen/, runner support, etc.),
        # making a directory denylist unsafe. Stale event folders are harmless
        # and must be reviewed/removed deliberately rather than guessed here.
        echo "ℹ️  Top-level directories are never deleted by weekly cleanup."

        # dashboard_data/ is intentionally NOT cleared: it holds the CURRENT week's
        # data under generic filenames (model_predictions_*, sg_dist_player, etc.),
        # is overwritten every week by push_dashboard_data, and is served live by
        # Render. Wiping it mid-week deleted current-week files (the bug this fix
        # addresses); since it self-overwrites it never accumulates stale data.
        echo "ℹ️  Skipping dashboard_data/ (current-week data, overwritten weekly by push_dashboard_data)."

        # Clear PAST-week per-tournament prep under permanent_data/ — keep the CURRENT
        # tourney and all permanent reference data (correlation matrices, bet_ledger,
        # sg_diagnostic, wind_test, course_coordinates).
        echo "🗑️  Clearing past-week per-tournament prep under permanent_data/ (keeping ${TOURNEY})..."
        find permanent_data -maxdepth 1 -type f -name "avg_expected_cat_sg_*.csv" \
          ! -name "*${TOURNEY}*" -delete 2>/dev/null || true

        echo ""
        echo "✅ Cleanup complete!"
        echo "================================================"
        
        # Show what remains
        echo ""
        echo "📁 Remaining files in repo:"
        ls -lah
    
    - name: Summary
      run: |
        echo "================================================"
        echo "🎯 CLEANUP SUMMARY"
        echo "================================================"
        echo "✅ Deleted PAST-week CSV files (kept current week + permanent_data/)"
        echo "✅ Deleted PAST-week Excel workbooks"
        echo "✅ Deleted all text files (except requirements.txt)"
        echo "✅ Cleared PAST-week prep from permanent_data/ (kept current tourney)"
        echo "ℹ️  Top-level directories were not touched"
        echo "ℹ️  dashboard_data/ left intact (current-week data, overwritten weekly)"
        echo ""
        echo "📁 Protected (always kept):"
        echo "  - Anything tied to the current week (tourney slug from sim_inputs.py)"
        echo "  - permanent_data/ (correlation matrices, reference data)"
        echo "  - dashboard/ (dashboard app code)"
        echo "  - dashboard_data/ (current-week data for Render)"
        echo "  - deploy/ (maker service scripts)"
        echo "  - backups/ (code backups)"
        echo "  - .github/ (workflows)"
        echo "  - .git/ (version control)"
        echo "================================================"

    - name: Safety check — abort if critical files missing
      run: |
        # If the denylist excludes are wrong, the delete step can wipe prod
        # code. This guard checks for specific sentinel files BEFORE we
        # commit. If any are missing, the workflow fails loud rather than
        # silently pushing the destruction.
        critical=(
          "maker_dashboard/server.py"
          "maker_dashboard/static/app.js"
          "maker_dashboard/index.html"
          "deploy/run_maker.sh"
          ".githooks/pre-commit"
          "dashboard/app.py"
          "kalshi_maker.py"
          "new_sim.py"
          "round_sim.py"
          "sim_inputs.py"
          "rust/Cargo.toml"
          "rust/src/lib.rs"
        )
        missing=()
        for f in "${critical[@]}"; do
          if [ ! -f "$f" ]; then
            missing+=("$f")
          fi
        done
        if [ ${#missing[@]} -ne 0 ]; then
          echo "❌ Cleanup deleted critical files — refusing to commit:"
          printf '   - %s\n' "${missing[@]}"
          echo ""
          echo "The denylist in the delete step is missing an entry. Fix it"
          echo "before re-enabling this workflow."
          exit 1
        fi
        echo "✅ All critical files still present after cleanup."

    - name: Guard — never delete code/build files
      run: |
        # Hard rule: the weekly cleanup may only remove transient DATA. If it ever
        # removed a tracked code/build file — because a denylist entry is wrong or a
        # new code directory was not added to the keep-list — abort BEFORE committing
        # so the deletion is never pushed. The cleanup's intended deletions are all
        # data extensions (csv/xlsx/txt/parquet/pdf), so they never match this filter.
        # `git ls-files --deleted` lists tracked files now missing from the worktree
        # (the deletions are not yet staged at this point — the commit step is next).
        DELETED_CODE=$(git ls-files --deleted | grep -iE '\.(py|pyx|rs|toml|lock|sh|yml|yaml|cfg|ini)$' || true)
        if [ -n "$DELETED_CODE" ]; then
          echo "❌ ABORT — weekly cleanup removed tracked code/build files (refusing to commit):"
          echo "$DELETED_CODE" | sed 's/^/   - /'
          echo ""
          echo "The cleanup must only remove transient data. Add the offending dir/file"
          echo "to the keep-list in the delete step before re-running."
          exit 1
        fi
        echo "✅ Guard passed — no tracked code/build files were deleted."

    - name: Guard — allowlist every tracked deletion
      run: |
        # Fail closed unless every tracked deletion belongs to one of the exact
        # data scopes this workflow is allowed to clean:
        #   1) transient data files directly in the repo root, or
        #   2) old per-event SG prep files under permanent_data/.
        # No other directory contents, docs, configs, or extension types may be
        # removed even if an earlier cleanup command is changed incorrectly.
        forbidden=()
        while IFS= read -r path; do
          [ -z "$path" ] && continue

          if [[ "$path" == *"$TOURNEY"* ]]; then
            forbidden+=("$path (current tournament)")
            continue
          fi

          case "$path" in
            permanent_data/avg_expected_cat_sg_*.csv)
              ;;
            */*)
              forbidden+=("$path (directory contents are not allowlisted)")
              ;;
            *.csv|*.xlsx|*.txt|*.parquet|*.pdf)
              ;;
            *)
              forbidden+=("$path (extension is not allowlisted)")
              ;;
          esac
        done < <(git ls-files --deleted)

        if [ ${#forbidden[@]} -ne 0 ]; then
          echo "❌ ABORT — weekly cleanup attempted non-allowlisted deletions:"
          printf '   - %s\n' "${forbidden[@]}"
          exit 1
        fi

        echo "✅ Allowlist guard passed — every tracked deletion is approved transient data."

    - name: Commit and push cleanup
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --staged --quiet || git commit -m "Weekly cleanup: clear transient data"
        git push
